apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: semantic-router-api
  namespace: semantic-router
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - ai.home.arpa
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: 300s
      backendRefs:
        - group: ""
          kind: Service
          name: vllm-qwen-instruct-engine-service
          namespace: vllm
          port: 80
