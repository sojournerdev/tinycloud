apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: semantic-router
  namespace: semantic-router
  labels:
    platform.tinycloud.dev/monitoring: prometheus
spec:
  namespaceSelector:
    matchNames:
      - semantic-router
  selector:
    matchLabels:
      app.kubernetes.io/name: semantic-router
      app.kubernetes.io/instance: semantic-router
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
