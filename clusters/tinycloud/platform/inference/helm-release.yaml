apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vllm
  namespace: vllm
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: vllm-stack
      version: "0.1.12"
      sourceRef:
        kind: HelmRepository
        name: vllm
        namespace: flux-system
      interval: 12h
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    routerSpec:
      enableRouter: false
    servingEngineSpec:
      strategy:
        type: Recreate
      serviceMonitor:
        enabled: true
        additionalLabels:
          platform.tinycloud.dev/monitoring: prometheus
      modelSpec:
        - name: qwen3-8b
          repository: vllm/vllm-openai
          tag: v0.29.0
          modelURL: Qwen/Qwen3-8B-AWQ
          requestCPU: 2
          requestMemory: 6Gi
          requestGPU: 1
          requestGPUType: nvidia.com/gpu
          limitCPU: "4"
          limitMemory: 10Gi
          storageClass: local-path
          pvcStorage: 10Gi
          vllmConfig:
            tensorParallelSize: 1
            maxModelLen: 8192
            dtype: bfloat16
            quantization: awq
            gpuMemoryUtilization: 0.9
            extraArgs:
              - --served-model-name
              - qwen3-8b
              - --enable-auto-tool-choice
              - --tool-call-parser
              - hermes
