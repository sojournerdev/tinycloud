apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform
  namespace: flux-system
  labels:
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/name: platform
    platform.tinycloud.dev/layer: platform
spec:
  interval: 30m
  path: ./clusters/tinycloud/platform
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: infrastructure
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  wait: true
  timeout: 10m
