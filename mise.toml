[tools]
uv = "0.9.18"
python = "3.14.7"
age = "1.3.2"
flux2 = "2.9.5"
helm = "4.3.0"
kubectl = "1.35.3"
kustomize = "5.8.1"
mkcert = "1.4.4"
shellcheck = "0.11.0"
sops = "3.13.3"
yamllint = "1.36.1"

[env]
_.file = ".env"
_.python.venv = { path = "machines/.venv", create = true }
SOPS_CONFIG = "{{config_root}}/.sops.yaml"

# ── Ansible ───────────────────────────────────────────────────────
[tasks.setup]
description = "Prepare the Ansible controller environment"
depends = ["collections"]

[tasks.python-deps]
description = "Install locked Ansible controller dependencies"
dir = "machines"
run = "uv pip sync requirements.lock"

[tasks.collections]
description = "Install pinned Ansible collections"
depends = ["python-deps"]
dir = "machines"
run = "ansible-galaxy collection install -r requirements.yml"

[tasks.ansible-doctor]
description = "Check Ansible controller prerequisites"
depends = ["collections"]
dir = "machines"
run = [
  "ansible --version",
  "ansible-galaxy collection list",
  "ansible-inventory -i inventory/workstation.yml --list >/dev/null",
  "ansible-inventory -i inventory/server.yml --list >/dev/null",
]

[tasks.workstation-deploy]
description = "Configure workstation"
depends = ["collections"]
dir = "machines"
run = "ansible-playbook playbooks/workstation.yml -i inventory/workstation.yml"

[tasks.workstation-check]
description = "Preview workstation changes with Ansible check mode"
depends = ["collections"]
dir = "machines"
run = "ansible-playbook playbooks/workstation.yml -i inventory/workstation.yml --check --diff"

[tasks.ansible-verify]
description = "Run read-only Ansible verification and host preview"
depends = ["collections"]
dir = "machines"
run = [
  "ansible-playbook playbooks/workstation.yml -i inventory/workstation.yml --tags workstation_verify",
  "ansible-playbook playbooks/server.yml -i inventory/server.yml -c ssh --check --diff",
]

[tasks.host-deploy]
description = "Apply host configuration"
dir = "machines"
depends = ["collections"]
confirm = "Apply host configuration?"
run = "ansible-playbook playbooks/server.yml -i inventory/server.yml -c ssh"

[tasks.host-check]
description = "Preview host changes with Ansible check mode"
depends = ["collections"]
dir = "machines"
run = "ansible-playbook playbooks/server.yml -i inventory/server.yml -c ssh --check --diff"

# ── Lint ──────────────────────────────────────────────────────────
[tasks.lint]
description = "Run all linters"
depends = ["collections"]
dir = "machines"
run = [
  "shellcheck ../scripts/*.sh",
  "ansible-lint roles/",
  "ansible-playbook playbooks/workstation.yml -i inventory/workstation.yml --syntax-check",
  "ansible-playbook playbooks/server.yml -i inventory/server.yml --syntax-check",
  "yamllint roles/ inventory/ playbooks/ ../clusters/tinycloud/infrastructure/ ../clusters/tinycloud/platform/",
]

# ── Check ─────────────────────────────────────────────────────────
[tasks.check]
description = "Run all checks"
depends = ["lint", "cluster-test"]

# ── Cluster ───────────────────────────────────────────────────────
[tasks.cluster-setup]
description = "Install the pinned Flux schema plugin"
run = "flux plugin install schema@0.5.0"

[tasks.cluster-test]
description = "Catch invalid Flux resources before deployment"
depends = ["cluster-setup"]
run = "scripts/cluster-test-config.sh"

# ── TLS ──────────────────────────────────────────────────────────
[tasks.tls-generate]
description = "Generate TLS cert and store encrypted secret in Git"
run = "scripts/tls-generate.sh"
